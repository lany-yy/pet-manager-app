name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk unzip zip libgl1-mesa-dev

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer

    - name: Accept Android SDK licenses
      run: |
        mkdir -p /tmp/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d /tmp/android-sdk
        export ANDROID_HOME=/tmp/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/bin:$PATH
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "build-tools;37.0.0" "platforms;android-33" > /dev/null 2>&1 || true

    - name: Build APK
      run: buildozer android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pet-manager-apk
        path: bin/*.apk
        retention-days: 90
